# Staging profile — full stack targeting dev/staging cluster.
# Requires Docker, K8s, Terraform (staging), and cloud credentials via IRSA/WI.
# See ADR-033 (Local-first stack profiles).

profile: staging

requires:
  docker: true
  kubernetes: true
  terraform: true
  cloud_credentials: true

mlflow:
  tracking_uri: "http://mlflow.mlflow-system.svc.cluster.local:5000"
  experiment_name: "{@ service_slug @}_staging"

serving:
  host: "0.0.0.0"
  port: 8000
  workers: 1

drift:
  schedule: cronjob
  cron: "0 */6 * * *"

deploy:
  enabled: true
  mode: CONSULT
  overlays:
    - "gcp-dev"
    - "gcp-staging"
    - "aws-dev"
    - "aws-staging"
