# tfsec baseline — May 2026 audit HIGH-1.
#
# Format: https://aquasecurity.github.io/tfsec/v1.28/guides/configuration/config/
# Each excluded check_id MUST have a comment citing the ADR/issue + expiry date.
# Audit `docs/audit/baseline-review.md` quarterly.
#
# ──────────────────────────────────────────────────────────────────────────────
# WORKFLOW: to add a new exclusion
#   1. Fix or document WHY it cannot be fixed right now.
#   2. Add the check ID below with a comment: ADR/issue ref + review-by date.
#   3. Open a tracking issue so it does not rot silently.
# ──────────────────────────────────────────────────────────────────────────────

exclude:
  # PSP (PodSecurityPolicy) was deprecated in K8s 1.21 and REMOVED in K8s
  # 1.25.  GKE clusters on REGULAR channel run 1.27+; enabling PSP would
  # cause a Terraform error.  Pod Security Standards (PSS) are enforced via
  # namespace labels in every overlay (D-29, templates/k8s/overlays/*/
  # namespace.yaml).  Review-by: 2027-01 (when tfsec migrates to trivy/PSS).
  - google-gke-enforce-pod-security-policy

  # master_authorized_networks_config IS present in compute.tf (lines 38–49)
  # as a `dynamic` block gated on var.master_authorized_networks.  tfsec
  # v1.28 static analysis does not evaluate dynamic blocks; it reports the
  # block as absent even when the HCL is correct.  Environment overlays
  # MUST supply non-empty `master_authorized_networks` for staging/prod
  # (enforced by the variable validation rule in variables.tf).
  # Review-by: 2027-01 (re-evaluate after tfsec→trivy migration).
  - google-gke-enable-master-networks

  # tfsec evaluates `node_config.metadata["disable-legacy-endpoints"]` only on
  # the `google_container_cluster` resource. Our pattern uses
  # `remove_default_node_pool = true` + two `google_container_node_pool`
  # resources (system + workload), so the cluster has NO node_config —
  # the metadata attribute lives on the pools (compute.tf:111-113 and
  # compute.tf:152-154), where tfsec's adapter does not correlate it back
  # to the cluster check. This is a known tfsec limitation for the
  # separately-managed-node-pool pattern, not a missing control.
  #
  # Actual security posture (defense-in-depth, per GCP hardening guide):
  #   1. `workload_metadata_config { mode = "GKE_METADATA" }` on both pools
  #      — Workload Identity shields the v1 metadata server from pods;
  #      it ALONE is sufficient to prevent SSRF-style metadata exfiltration.
  #   2. `metadata = { "disable-legacy-endpoints" = "true" }` on both pools
  #      — additionally blocks the v0.1 endpoint that does not require
  #      the Metadata-Flavor header. Redundant but kept (belt + suspenders).
  #
  # Review-by: 2027-01 (re-evaluate after tfsec→trivy migration; trivy may
  # correlate node_pool resources to the cluster correctly).
  - google-gke-metadata-endpoints-disabled

minimum_severity: HIGH
