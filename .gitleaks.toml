# Gitleaks configuration — ML-MLOps Production Template
# Used by pre-commit and CI to detect hardcoded secrets in template code
# Full rule reference: https://github.com/gitleaks/gitleaks

title = "ML-MLOps Production Template"

[extend]
useDefault = true

# NOTE — do NOT reintroduce a singular `[allowlist]` table here.
#
# One was added (AUDIT R11 "L-2") to work around gitleaks < 8.25 silently
# ignoring the plural `[[allowlists]]` tables below. It duplicated every
# entry, and gitleaks >= 8.25 REFUSES to load a config containing both:
#
#   FTL Failed to load config
#       error="[allowlist] is deprecated, it cannot be used alongside [[allowlists]]"
#
# So the compatibility shim became the thing blocking the upgrade. The fix
# is the other direction: pin a modern gitleaks everywhere (>= 8.25) and
# keep exactly one allowlist dialect — the plural one. Every entry the
# singular block carried is present in the plural tables below; it was a
# strict duplicate, so removing it changes no scan outcome on >= 8.25.
#
# The version pin lives in BOTH `.pre-commit-config.yaml` files and in the
# CI job that installs the binary. Those must move together.

[[allowlists]]
description = "Template placeholders and example values"
regexes = [
    # Template placeholder tokens — not real secrets
    '''YOUR_GCP_PROJECT''',
    '''YOUR_AWS_ACCOUNT''',
    '''\{SERVICE[_A-Z]*\}''',
    '''\{service[_a-z]*\}''',
    # Example/test values
    '''example\.com''',
    '''localhost''',
    '''127\.0\.0\.1''',
    # Documentation snippets
    '''<YOUR_''',
]

[[allowlists]]
description = "Allow .env.example files — intentionally shows format, not real values"
paths = [
    '''templates/.*\.env\.example''',
    '''examples/.*\.env\.example''',
]

[[allowlists]]
description = "Allow ADR-018 redaction-pipeline test fixtures — canonical synthetic patterns matching gitleaks rules but NOT real secrets (per test_memory_redaction.py docstring). Also allow the secret-history-scan runbook which documents canonical EXAMPLE patterns (AWS AKIAIOSFODNN7EXAMPLE) as bypass-test inputs."
paths = [
    '''.*test_memory_redaction\.py$''',
    '''.*secret-history-scan\.md$''',
    '''.*\.pyc$''',
    # Compiled bytecode of the redaction fixtures above — local `--no-git`
    # scans walk __pycache__ even though git never tracks it (AUDIT R11 L-2).
    '''.*__pycache__.*''',
]

[[allowlists]]
description = "Allow closed, historical staff/lead audit reports — prose discussing security posture (IRSA/WIF, Cosign, SBOM, Kyverno, IAM) trips generic-api-key on entropy alone; confirmed no real leak via 'gitleaks detect --no-git' against the plain file. These are frozen records of already-remediated findings, same class as the already-allowlisted secret-history-scan runbook."
paths = [
    '''docs/audit/AUDIT_R[0-9]+_STAFF_LEAD\.md$''',
]
