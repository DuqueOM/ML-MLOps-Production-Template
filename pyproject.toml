[tool.pytest.ini_options]
# Load tests use Locust (not pytest) — skip during collection.
# --import-mode=importlib: three sibling test packages are all named `tests`
# (templates/service/tests, templates/service/eda/tests,
# templates/service/monitoring/tests); the default `prepend` mode collides in
# sys.modules and aborts collection from the repo root (AUDIT R8-05).
addopts = "--ignore=templates/service/tests/load_test.py --import-mode=importlib"
# Root env must execute async tests, not silently pass them (AUDIT R8-08);
# requires pytest-asyncio (CI installs it explicitly, dev-setup mirrors that).
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "examples/minimal/serve.py",
    "examples/minimal/drift_check.py",
    "examples/minimal/train.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# ── Ruff: lint + format, replacing black + isort + flake8 (ADR-044) ──────────
#
# One tool, one config, one exclude list. The three it replaces each carried
# their own copy of the same exclude block, in two pre-commit configs — six
# places to keep in sync, which is the actual cost this consolidation
# removes. Speed was NOT the motivation: the previous suite already ran
# `--all-files` in 2.62 s, inside the config's own < 5 s target.
#
# Ruff does NOT replace mypy (no type checking) and only partially overlaps
# bandit; both are retained. See ADR-044 for the full rationale.
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "data",
    "models",
    "mlruns",
    "__pycache__",
    # Copier render root — `{@ service_slug @}` path segments are Jinja
    # tokens, not valid Python identifiers. Same rationale as the mypy
    # scope note in .pre-commit-config.yaml.
    "templates/service/src",
]

[tool.ruff.lint]
# DELIBERATE PARITY SCOPE — this set reproduces exactly what
# black + isort + flake8 already enforced, nothing more:
#
#   E,W = pycodestyle (flake8 core)
#   F   = pyflakes    (flake8 core)
#   I   = isort
#
# Ruff also ships `UP` (pyupgrade), `B` (bugbear), `S` (bandit) and others.
# Enabling them here would surface 90 new findings in this repo and turn a
# toolchain swap into a code change — two different reviews in one diff.
# They are a separate, deliberate decision; see ADR-044 §"Deferred rulesets".
select = ["E", "W", "F", "I"]
# E203 (whitespace before ':') conflicts with the formatter, exactly as it
# did under black — it was in the old flake8 `--extend-ignore` for the same
# reason. W503 has no ruff equivalent; ruff never emits it.
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["app", "common_utils"]

[tool.ruff.format]
# Matches the black settings this replaces.
quote-style = "double"
indent-style = "space"
