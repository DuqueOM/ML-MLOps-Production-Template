# Documentation path-reference baseline
# =============================================================================
# Enforced by `scripts/check_doc_path_refs.py`, wired into
# `.github/workflows/validate-templates.yml`.
#
# Every entry here is a repo path named in living documentation that does not
# resolve. The gate tolerates exactly these and fails on any new one, so the
# list can only shrink without a deliberate decision.
#
# Contract, mirroring `.security-baselines/` (see
# `scripts/check_baselines_expiry.py`): every entry is explicit, dated and
# reviewable. Past its `expiry` the gate fails, which forces either a real fix
# or a fresh justification. An entry whose path starts resolving also fails,
# so the baseline cannot silently outlive its reason.
#
# Two kinds of entry live here and they are NOT equivalent:
#
#   runtime-artifact — the file is genuinely created while a generated service
#     runs. The reference is correct; the file simply is not tracked in git.
#
#   unimplemented — the documentation promises something that was never built.
#     These are defects with a doc-shaped symptom: an agent following the
#     workflow will reach for a file that is not there. They carry short
#     expiries on purpose.
# =============================================================================

entries:
  # --- runtime-artifact -----------------------------------------------------
  - path: docs/concept_drift_log.md
    reason: runtime-artifact — appended by the concept-drift-analysis skill inside a generated service; not tracked here
    expiry: 2027-09-04

  - path: docs/performance_review_log.md
    reason: runtime-artifact — appended by the performance-review workflow inside a generated service; not tracked here
    expiry: 2027-09-04

  # --- unimplemented --------------------------------------------------------
