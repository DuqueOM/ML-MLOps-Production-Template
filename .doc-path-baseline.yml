# Documentation path-reference baseline
# =============================================================================
# Enforced by `scripts/check_doc_path_refs.py`, wired into
# `.github/workflows/validate-templates.yml` and pre-commit.
#
# Every entry here is a repo path named in living documentation or in a code
# comment that does not resolve. The gate tolerates exactly these and fails on
# any new one, so the list can only shrink without a deliberate decision.
#
# Two kinds, verified differently, because they are not the same claim:
#
#   unimplemented    — the documentation promises something never built. The
#     claim is "we intend to fix this", and the only honest check is a
#     deadline. Requires `expiry:`; fails once past it.
#
#   runtime-artifact — the file really is created while a generated service
#     runs. The claim is "this resolves at runtime, and X creates it", which
#     is checkable NOW. Requires `created-by:` naming that file; the gate
#     asserts it still exists and still references the path. Carrying a date
#     here is rejected: the condition never changes, so an expiry could only
#     ever be bumped, and a date that can only be postponed trains reviewers
#     to postpone dates — degrading the mechanism for the entries where the
#     deadline is the whole point.
#
# The gate fails on: a new unresolved path, an expired `unimplemented` entry,
# a `runtime-artifact` whose creator is gone or no longer names the path, and
# any entry that starts resolving (a baseline may not outlive its reason).
# =============================================================================

entries:
  - path: docs/concept_drift_log.md
    kind: runtime-artifact
    created-by: agentic/skills/concept-drift-analysis/SKILL.md
    reason: appended by the concept-drift-analysis skill inside a generated service; not tracked here

  - path: docs/performance_review_log.md
    kind: runtime-artifact
    created-by: agentic/workflows/performance-review.md
    reason: appended by the performance-review workflow inside a generated service; not tracked here
